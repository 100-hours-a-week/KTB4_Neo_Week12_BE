services:
  redis:
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: community
      MYSQL_USER: community
      MYSQL_PASSWORD: local-development-password
      MYSQL_ROOT_PASSWORD: local-root-password
      TZ: UTC

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

    ports:
      - "3307:3306"

    volumes:
      - mysql-local-data:/var/lib/mysql

    networks:
      - community-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: "jdbc:mysql://mysql:3306/community?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC"
      DB_USERNAME: community
      DB_PASSWORD: local-development-password

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

volumes:
  mysql-local-data:
