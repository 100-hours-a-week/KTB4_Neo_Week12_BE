spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/community?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:community}
    password: ${DB_PASSWORD:local-performance-password}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO

draft:
  redis-ttl: 3d
  sync-delay: 365d
  sync-interval: 365d
  sync-batch-size: 100
  cleanup-interval: 365d
  retention: 7d
  cleanup-batch-size: 100