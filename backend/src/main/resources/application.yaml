spring:
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/community?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:community}
    password: ${DB_PASSWORD:local-development-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: false
        jdbc:
          time_zone: UTC

  application:
    name: community

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE


server:
  servlet:
    context-path: /api

draft:
  redis-ttl: 3d
  sync-delay: 0s
  sync-interval: 60s
  sync-batch-size: 100
  cleanup-interval: 24h
  retention: 7d
  cleanup-batch-size: 100

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket-name: ${S3_BUCKET_NAME:local-community-images}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost.invalid}
    presigned-url-expiration-seconds: ${S3_PRESIGNED_URL_EXPIRATION_SECONDS:300}
    upload-session-ttl-seconds: ${S3_UPLOAD_SESSION_TTL_SECONDS:600}
    max-image-size: ${S3_MAX_IMAGE_SIZE:10485760}
