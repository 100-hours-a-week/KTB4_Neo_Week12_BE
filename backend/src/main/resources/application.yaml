spring:
  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/community}
    username : ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  application:
    name: community

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    context-path: /api

draft:
  redis-ttl: 3d
  sync-delay: 0s
  sync-interval: 60s
  sync-batch-size: 100
  cleanup-interval: 24h
  retention: 7d
  cleanup-batch-size: 100

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket-name: ${S3_BUCKET_NAME:local-community-images}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost.invalid}
    presigned-url-expiration-seconds: ${S3_PRESIGNED_URL_EXPIRATION_SECONDS:300}
    upload-session-ttl-seconds: ${S3_UPLOAD_SESSION_TTL_SECONDS:600}
    max-image-size: ${S3_MAX_IMAGE_SIZE:10485760}
