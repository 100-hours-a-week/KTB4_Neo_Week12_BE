spring:
  datasource:
    url: jdbc:tc:mysql:8.4:///community_test?TC_TMPFS=/var/lib/mysql:rw
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

draft:
  redis-ttl: 3d
  sync-delay: 0s
  sync-interval: 60s
  sync-batch-size: 100
  cleanup-interval: 24h
  retention: 7d
  cleanup-batch-size: 100

jwt:
  secret: test-jwt-secret-key-for-automated-tests-only
  expiration: 3600000
  refresh-expiration: 604800000
