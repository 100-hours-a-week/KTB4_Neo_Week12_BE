name: Backend CI/CD

# 워크플로우 실행 조건
on:
  workflow_dispatch:

  # Github 코드 push 된 경우 실행
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "compose.yml"
      - ".github/workflows/backend-ci-cd.yml"

permissions:
  contents: read

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

# 실행할 작업 목록
jobs:
  # 백엔드 docker 이미지 빌드 및 docker hub push
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest

    # 순서대로 실행할 단계 -> 순서 중요
    steps:
      # GitHub 저장소의 소스 코드를 Runner로 가져옴
      - name: Checkout backend repository
        uses: actions/checkout@v4

      # Docker 멀티 플랫폼 빌드를 위한 Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 백엔드 Docker Image 빌드 및 Docker Hub push
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          # latest : compose.yml에서 최신 이미지를 pull
          # ${{ github.sha }}: 어떤 코드로 빌드한 이미지인지 정확히 추적
          # SHA 태그: 최신 버전에 문제가 생겼을 때 이전 커밋 이미지로 롤백 가능
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ktb-community-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/ktb-community-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Docker Hub 이미지를 EC2에 배포
  deploy:
    name: Deploy backend to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # compose.yml을 가져오기 위해 저장소 쳌 아웃
      - name: Checkout backend repository
        uses: actions/checkout@v4

      # EC2 SSH 접속에 필요한 개인키와 known_hosts 준비
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/community-server-key.pem
          chmod 600 ~/.ssh/community-server-key.pem
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      # EC2에 배포 디렉토리 없으면 생성
      - name: Prepare EC2 directory
        run: |
          ssh \
            -i ~/.ssh/community-server-key.pem \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}'"

      # 로컬 Runner의 compose.yml을 EC2로 복사
      - name: Copy production Compose file
        run: |
          scp \
            -i ~/.ssh/community-server-key.pem \
            compose.prod.yml \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_PATH }}/compose.prod.yml"

      # EC2에서 최신 백엔드 이미지 pull 및 컨테이너 갱신
      - name: Pull and deploy backend
        run: |
          ssh \
            -i ~/.ssh/community-server-key.pem \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && \
             docker compose -f compose.prod.yml pull backend && \
             docker compose -f compose.prod.yml up -d backend && \
             docker compose -f compose.prod.yml ps backend"

      # 애플리케이션 시작을 기다린 후 상태와 로그 확인
      - name: Check backend
        run: |
          sleep 35

          ssh \
            -i ~/.ssh/community-server-key.pem \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && \
             docker compose -f compose.prod.yml ps backend && \
             docker compose -f compose.prod.yml logs --tail=100 backend"